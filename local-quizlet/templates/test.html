{% extends "base.html" %}
{% block title %}Test - Lexlet{% endblock %}
{% block content %}
{% include "_test_shell.html" %}
<script>
function bindTestShell() {
    const answerInput = document.querySelector('.test-shell input[name="answer"]');
    if (answerInput) {
        answerInput.focus({ preventScroll: true });
        answerInput.select();
    }
}

document.addEventListener('submit', async (event) => {
    const form = event.target.closest('.test-shell form');
    if (!form) {
        return;
    }

    event.preventDefault();

    const submitButton = form.querySelector('button[type="submit"]');
    if (submitButton) {
        submitButton.disabled = true;
    }

    const formUrl = form.getAttribute('action') || window.location.href;
    const formMethod = form.getAttribute('method') || 'POST';

    try {
        const response = await fetch(formUrl, {
            method: formMethod,
            body: new FormData(form),
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
            },
        });

        if (!response.ok) {
            window.location.href = formUrl;
            return;
        }

        const html = await response.text();
        const template = document.createElement('template');
        template.innerHTML = html.trim();
        const nextTestShell = template.content.querySelector('.test-shell');
        const currentTestShell = document.querySelector('.test-shell');

        if (!nextTestShell || !currentTestShell) {
            window.location.href = formUrl;
            return;
        }

        currentTestShell.replaceWith(nextTestShell);
        bindTestShell();
    } catch (error) {
        window.location.href = formUrl;
    }
});

document.addEventListener('keydown', (event) => {
    const continueForm = document.querySelector('.continue-form');
    if (!continueForm) {
        return;
    }

    if (event.key !== 'Enter' || event.shiftKey || event.ctrlKey || event.altKey || event.metaKey) {
        return;
    }

    if (event.target.closest('input, textarea, select, button, a')) {
        return;
    }

    event.preventDefault();
    continueForm.requestSubmit();
});

window.addEventListener('load', bindTestShell);
</script>
{% endblock %}
